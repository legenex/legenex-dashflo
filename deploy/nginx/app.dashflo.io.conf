# DashFlo operator application. Install only after app.dashflo.io resolves to
# this VPS. Keep the previous dashboard host working until login and OAuth are
# verified here, then reserve dashflo.io for the marketing website.

server {
    listen 80;
    listen [::]:80;
    server_name app.dashflo.io;

    # Certbot certificates for this host use /var/www/html as their webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.dashflo.io;

    ssl_certificate /etc/letsencrypt/live/app.dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Owner migration packages can contain all durable entities. Multer applies
    # the matching 250 MB application-side limit.
    client_max_body_size 250m;

    # The application bundle and its JSON responses travel uncompressed
    # otherwise. gzip_proxied is required because this content comes from the
    # upstream rather than from disk.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
