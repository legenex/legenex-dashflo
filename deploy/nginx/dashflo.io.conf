# Canonical public DashFlo marketing website. The operator application is
# served separately at app.dashflo.io.

server {
    listen 80;
    listen [::]:80;
    server_name dashflo.io www.dashflo.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dashflo.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dashflo.io;

    ssl_certificate /etc/letsencrypt/live/dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dashflo.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashflo.io;

    ssl_certificate /etc/letsencrypt/live/dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dashflo;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /brand/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
