# Canonical public DashFlo marketing website. The operator application is
# served separately at app.dashflo.io.

server {
    listen 80;
    listen [::]:80;
    server_name dashflo.io www.dashflo.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dashflo.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dashflo.io;

    ssl_certificate /etc/letsencrypt/live/dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dashflo.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashflo.io;

    ssl_certificate /etc/letsencrypt/live/dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dashflo;
    index index.html;

    # The site was serving every byte uncompressed: roughly 460 KB of HTML, CSS
    # and JavaScript that compresses to a small fraction of that. Only text is
    # listed; PNG and WOFF2 are already compressed and re-compressing them costs
    # CPU for nothing. text/html is always included when gzip is on and must not
    # be named here.
    #
    # Brotli would do better still, but it needs a module that is not part of
    # stock nginx, so it stays a documented follow-up rather than a change that
    # can fail a config test on deploy.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fingerprinted build output. The filename changes whenever the bytes do,
    # so it can be cached permanently.
    #
    # The regex must stay quoted. nginx treats an unquoted { as the start of a
    # block, so the {8,} repetition split the directive and the config failed to
    # load. This was found on the server and fixed by hand there; the quoted form
    # belongs here so a deploy from the repository does not reintroduce it.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.(css|js)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hand-authored assets keep stable filenames (site-router.js, brand.css,
    # hero.css, legal.css). These were being served immutable for a year, which
    # meant a returning visitor would keep the old site-router.js and never see
    # a deploy. They revalidate instead: a 304 costs almost nothing and a
    # release actually reaches people.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /brand/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
