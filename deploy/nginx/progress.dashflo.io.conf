# DashFlo Progress Control Center. Internal owner tooling.
#
# Architecture: this is a proxy to the same application on 127.0.0.1:4000 that
# serves app.dashflo.io. There is no second application stack, no second build,
# and no static copy of the bundle on disk here.
#
# That is deliberate, and the Host header is the reason it is safe. The
# application reads the hostname it was reached on and scopes itself: on this
# host it serves the Control Center and the authentication routes and nothing
# else, and every other path redirects back to /progress rather than rendering.
# See client/src/lib/hostScope.js. A static root here would serve index.html for
# any path and hand that decision to the browser instead.
#
# Authorization is not done here either. nginx cannot tell an owner from an
# admin, so it does not try: the server refuses Progress entities and Progress
# functions to any caller that is not the owner, whatever host asked. See
# server/src/lib/progressAccess.js. This file is transport and hostname, not
# access control.
#
# Sessions are not shared with app.dashflo.io. The cookie is host-only, so
# signing in here creates a session for this hostname alone. Nothing is widened
# to .dashflo.io and no token is passed between the two hosts.

server {
    listen 80;
    listen [::]:80;
    server_name progress.dashflo.io;

    # Certbot uses the same webroot as the other DashFlo hosts.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name progress.dashflo.io;

    ssl_certificate /etc/letsencrypt/live/progress.dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progress.dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep the Control Center out of search indexes. The application also sets a
    # robots meta tag, but a header is what a crawler sees without executing
    # JavaScript, so this is the one that does the work. "always" so it is sent
    # on error and redirect responses too, not only on 200.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Screenshots of internal pages are uploaded from the review workspace.
    client_max_body_size 25m;

    # Same compression as the application host. The bundle and its JSON come
    # from the upstream rather than from disk, which is what gzip_proxied is
    # for.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # One location, no static root, no try_files, no autoindex. Everything is
    # proxied, so there is no directory to list and no file that could be served
    # without the application seeing the request. SPA refresh works because the
    # application itself answers unknown paths with index.html.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # $host, not a literal. The application scopes itself by the hostname it
        # is reached on, so forwarding app.dashflo.io here would serve the
        # operator dashboard on this domain.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
