# Public DashFlo supplier API. Install as
# /etc/nginx/sites-available/api.dashflo.io after the certificate exists, then
# link it from sites-enabled and validate with nginx -t before reloading.

server {
    listen 80;
    listen [::]:80;
    server_name api.dashflo.io;

    # Certbot certificates for this host use /var/www/html as their webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dashflo.io;

    ssl_certificate /etc/letsencrypt/live/api.dashflo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dashflo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Supplier responses and reporting payloads are JSON and compress well.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
