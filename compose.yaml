services:
  db:
    container_name: dashflo-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashflo_staging
      POSTGRES_USER: dashflo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dashflo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U dashflo -d dashflo_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    container_name: dashflo-app
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: dashflo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: dashflo_staging
      PGSSL: "false"
      UPLOAD_DIR: /app/server/uploads
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - dashflo_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD-SHELL","node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dashflo_pgdata:
  dashflo_uploads:
